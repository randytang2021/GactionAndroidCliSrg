name: 'Test Setup Android CLI'
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check if dist/ is up to date
        run: |
          npm install
          npm run build
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ is out of sync. Please run 'npm run build' and commit the changes."
            git diff
            exit 1
          fi

      - name: Test Setup Android CLI
        uses: ./
        with:
          cmdline-tools-version: '11076708'
          accept-licenses: 'true'

      - name: Verify sdkmanager
        run: sdkmanager --version
